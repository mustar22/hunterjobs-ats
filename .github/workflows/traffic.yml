# GitHub only keeps 14 days of traffic data, so anything older is gone forever
# unless something writes it down. This polls daily and accumulates the totals
# on a separate `traffic-data` branch (keeps the noise out of main's history).
name: traffic

on:
  schedule:
    - cron: "17 3 * * *"      # daily, odd minute to dodge the on-the-hour rush
  workflow_dispatch:           # and on demand

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the data branch (create it on first run)
        uses: actions/checkout@v4
        with:
          ref: traffic-data
          fetch-depth: 1
        continue-on-error: true

      - name: Accumulate clones + views
        env:
          # TRAFFIC_TOKEN is REQUIRED, not a fallback: the traffic API needs
          # admin/push access and GITHUB_TOKEN can never have it — there's no
          # `administration` permission for workflow tokens. Use a fine-grained
          # PAT with Administration: Read on this repo.
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::TRAFFIC_TOKEN secret is not set"; exit 1; }
          mkdir -p traffic
          [ -f traffic/totals.json ] || echo '{"clones":0,"views":0,"seen":{}}' > traffic/totals.json

          # -f so a 403 is a failure, not a file full of error JSON. Silently
          # recording 0 for a month is worse than a red X on day one.
          for kind in clones views; do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$REPO/traffic/$kind" > "$kind.json" \
              || { echo "::error::traffic/$kind failed - is TRAFFIC_TOKEN valid and admin-read?"; exit 1; }
            python3 -c "import json,sys; d=json.load(open('$kind.json')); sys.exit(0 if '$kind' in d else 1)" \
              || { echo "::error::traffic/$kind returned no '$kind' key: $(head -c 200 $kind.json)"; exit 1; }
          done

          python3 - <<'PY'
          import datetime, json, pathlib
          t = json.loads(pathlib.Path("traffic/totals.json").read_text())
          t.setdefault("seen", {})
          for kind in ("clones", "views"):
              data = json.loads(pathlib.Path(f"{kind}.json").read_text())
              for day in data.get(kind, []):
                  # keyed per day, last value wins: overlapping 14-day windows
                  # can't double count, and today's partial count self-corrects
                  # when tomorrow's poll reports the finished number
                  #
                  # uniques, not count: raw clones are mostly bots. 211 clones
                  # against 4 unique page views means CI and mirrors, not people,
                  # and a badge saying 211 would imply 211 humans.
                  #
                  # summing DAILY uniques still over-counts anyone who clones on
                  # more than one day (14-day sum: 87 vs the API's deduped 78).
                  # Unavoidable if we want a running total past the 14-day
                  # window, and it errs far smaller than the raw count.
                  t["seen"][f"{kind}:{day['timestamp'][:10]}"] = day["uniques"]
              t[kind] = sum(v for k, v in t["seen"].items()
                            if k.startswith(f"{kind}:"))
          t["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          # shields.io endpoint format, so the badge needs no third-party service
          pathlib.Path("traffic/clones-badge.json").write_text(json.dumps({
              "schemaVersion": 1, "label": "unique clones", "color": "9d6fff",
              "message": f'{t["clones"]} since Jul 2026'}))
          pathlib.Path("traffic/totals.json").write_text(json.dumps(t, indent=1))
          print("clones:", t["clones"], "views:", t["views"])
          PY

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          git diff --staged --quiet || git commit -m "traffic: $(date -u +%Y-%m-%d)"
          git push origin HEAD:traffic-data
